[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-steward-ai"
version = "0.1.0"
description = "Governed data quality and remediation assistant"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0,<7",
  "openai>=1.40,<3",
  "langgraph>=0.6,<1.1",
  "langgraph-checkpoint-sqlite>=2.0,<4",
  "streamlit>=1.36,<2",
  "arize-otel>=0.8,<1",
  "arize-phoenix-otel>=0.8,<1",
  "openinference-instrumentation-openai>=0.1,<1",
  "openinference-instrumentation-langchain>=0.1,<1",
  "opentelemetry-api>=1.27,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9"]
evals = ["arize>=8,<9", "pandas>=2,<3"]

[project.scripts]
data-steward-seed = "data_steward.seed:main"
data-steward-eval = "data_steward.evaluations:main"

[tool.hatch.build.targets.wheel]
packages = ["src/data_steward"]
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
